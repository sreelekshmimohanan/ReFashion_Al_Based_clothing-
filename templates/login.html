{% load static %}
{% block content %}

{% include 'header.html' %}
  <br><br><br>
<style>
  .auth-section { background: linear-gradient(135deg, #f7f7f7 0%, #ffffff 100%); }
  .auth-card .input-group-text { background-color: #fff; border-right: 0; }
  .auth-card .form-control { border-left: 0; }
  .auth-card .form-control:focus { box-shadow: none; }
  .auth-title { font-weight: 700; }
  .muted { color: #777; }
  .divider { height: 1px; background: #eee; margin: 1rem 0 1.25rem; }
</style>

<section class="auth-section py-5 py-md-6">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-6">
        <div class="card border-0 shadow-lg rounded-4 auth-card">
          <div class="card-body p-4 p-md-5">
            <h3 class="auth-title mb-1">Welcome back</h3>
            <p class="muted mb-3">Log in to your Refashion account.</p>
            <div class="divider"></div>

            {% if message %}
              <div class="alert alert-danger" role="alert">{{ message }}</div>
            {% endif %}

            <form id="login" action="{% url 'addlogin' %}" method="post" novalidate>
              {% csrf_token %}
              <div class="row g-3">
                <div class="col-12">
                  <label for="email" class="form-label">Email</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                    <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required>
                  </div>
                </div>

                <div class="col-12">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-lock"></i></span>
                    <input name="password" id="password" type="password" class="form-control" placeholder="Your password" required>
                  </div>
                </div>

                <div class="col-12 d-grid mt-3">
                  <button type="submit" class="btn btn-dark py-2">
                    <i class="fa fa-sign-in me-1"></i>
                    Log In
                  </button>
                </div>
              </div>
            </form>

            <p class="text-center mt-4 mb-0">
              New to Refashion?
              <a href="{% url 'register' %}">Create an account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

        {% endblock %}
