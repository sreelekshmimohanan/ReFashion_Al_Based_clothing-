



{% load static %}

{% block content %}



  <div class="subscribe">
        {% include 'header.html' %}

        <style>
          .auth-section { background: linear-gradient(135deg, #f7f7f7 0%, #ffffff 100%); }
          .auth-card .input-group-text { background-color: #fff; border-right: 0; }
          .auth-card .form-control { border-left: 0; }
          .auth-card .form-control:focus { box-shadow: none; }
          .auth-title { font-weight: 700; }
          .muted { color: #777; }
          .divider { height: 1px; background: #eee; margin: 1rem 0 1.25rem; }
        </style>

        <section class="auth-section py-5 py-md-6">
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-md-10 col-lg-8 col-xl-6">
                <div class="card border-0 shadow-lg rounded-4 auth-card">
                  <div class="card-body p-4 p-md-5">
                    <h3 class="auth-title mb-1">Create your account</h3>
                    <p class="muted mb-3">Join Refashion to sell, buy, or donate.</p>
                    <div class="divider"></div>

                    {% if message %}
                      <div class="alert alert-warning" role="alert">{{ message }}</div>
                    {% endif %}

                    <form id="register" action="{% url 'addreg' %}" method="post" novalidate>
                      {% csrf_token %}
                      <div class="row g-3">
                        <div class="col-sm-6">
                          <label for="firstname" class="form-label">First name</label>
                          <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input name="firstname" id="firstname" type="text" class="form-control" placeholder="Jane" required>
                          </div>
                        </div>
                        <div class="col-sm-6">
                          <label for="lastname" class="form-label">Last name</label>
                          <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input name="lastname" id="lastname" type="text" class="form-control" placeholder="Doe" required>
                          </div>
                        </div>

                        <div class="col-12">
                          <label for="phone_number" class="form-label">Phone</label>
                          <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-phone"></i></span>
                            <input name="phone_number" id="phone_number" type="text" class="form-control" placeholder="+1 555 000 1234" required>
                          </div>
                        </div>

                        <div class="col-12">
                          <label for="email" class="form-label">Email</label>
                          <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                            <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required>
                          </div>
                        </div>

                        <div class="col-12">
                          <label for="password" class="form-label">Password</label>
                          <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                            <input name="password" id="password" type="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                          </div>
                        </div>

                        <div class="col-12 d-grid mt-3">
                          <button type="submit" class="btn btn-dark py-3 fs-5 fw-semibold">
                            <i class="fa fa-user-plus me-2" aria-hidden="true"></i> Create Account
                          </button>
                        </div>
                      </div>
                    </form>

                    <p class="text-center mt-4 mb-0">
                      Already have an account?
                      <a href="{% url 'login' %}">Log in</a>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          </section>

        {% include 'footer.html' %}
        {% endblock %}
